<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fbefe2">
<title>Kitty Merge</title>
<style>
  :root {
    --bg: #fbefe2; --ink: #4a3428; --muted: #9a7f6c; --card: #fff8f0; --line: #ecd9c6;
    --accent: #ff8a65; --accent2: #ffb74d; --good: #66bb6a;
    --grass1: #c5e6a8; --grass2: #b6dc95; --weed1: #7d6852; --weed2: #6f5b46; --fog: #e3e8ef;
    --cell: min(calc((100vw - 28px) / 7), calc((100vh - 320px) / 9), 62px);
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  @supports (height: 100dvh) { :root { --cell: min(calc((100vw - 28px) / 7), calc((100dvh - 320px) / 9), 62px); } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* HUD */
  .hud { width: calc(var(--cell) * 7 + 12px); display: flex; align-items: center; gap: 6px; }
  .title { font-weight: 800; font-size: clamp(14px, 4.4vw, 18px); margin-right: auto; white-space: nowrap; }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 700;
    font-size: 15px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .pill .sub { font-size: 11px; color: var(--muted); font-weight: 600; }
  .pill.bump { animation: bump .35s; }
  @keyframes bump { 50% { transform: scale(1.15); } }

  .quest { width: calc(var(--cell) * 7 + 12px); background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 8px 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; min-height: 48px; }
  .quest .q-text { flex: 1; }
  .quest .q-bar { height: 5px; background: var(--line); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .quest .q-bar i { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
  .quest .reward { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .quest button { border: 0; background: var(--good); color: #fff; font-weight: 800; border-radius: 10px; padding: 8px 12px;
    animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }

  /* Board */
  .board { display: grid; grid-template-columns: repeat(7, var(--cell)); grid-auto-rows: var(--cell); gap: 2px; padding: 4px;
    background: #8fbf73; border-radius: 16px; box-shadow: 0 4px 0 #6f9e56; touch-action: none; }
  .cell { position: relative; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .cell.grass { background: var(--grass1); }
  .cell.grass.alt { background: var(--grass2); }
  .cell.weed { background: radial-gradient(circle at 30% 30%, #8a7560 0 12%, transparent 13%),
    radial-gradient(circle at 72% 64%, #5f4c39 0 10%, transparent 11%), var(--weed1); }
  .cell.weed.alt { background-color: var(--weed2); }
  .cell.fog { background: var(--fog); box-shadow: inset 0 0 0 2px #fff6; flex-direction: column; font-size: calc(var(--cell) * .38); opacity: .9; }
  .cell.fog .price { font-size: 10px; font-weight: 800; color: #6b7a8c; font-family: inherit; }
  .cell.fog.locked { background: #cfd7e1; opacity: 1; font-size: calc(var(--cell) * .3); }
  .cell.preview { box-shadow: inset 0 0 0 3px #fff, 0 0 10px #fff; }
  .cell.target { box-shadow: inset 0 0 0 3px var(--accent2); }
  .cell.selected { box-shadow: inset 0 0 0 3px var(--accent); }

  .item { font-family: var(--emoji); font-size: calc(var(--cell) * .62); line-height: 1; position: relative; touch-action: none;
    filter: drop-shadow(0 2px 0 #0002); }
  .item.stuck { filter: grayscale(.7) brightness(.8); }
  .item.lifted { opacity: .25; }
  .item .lv { position: absolute; right: -6px; bottom: -4px; font: 800 9px/1 system-ui, sans-serif; color: #fff;
    background: #0006; border-radius: 6px; padding: 2px 3px; }
  .item .badge { position: absolute; left: -6px; top: -6px; font-size: 11px; }
  .item.ready { animation: wiggle 1.6s ease-in-out infinite; }
  @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-8deg); } 90% { transform: rotate(8deg); } }
  .cell.napping .item::after { content: '💤'; position: absolute; right: -6px; top: -8px; font-size: 12px; }
  .pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
  .ghost { position: fixed; pointer-events: none; z-index: 50; font-family: var(--emoji); font-size: calc(var(--cell) * .8);
    transform: translate(-50%, -60%); filter: drop-shadow(0 6px 4px #0003); }

  /* Info + shop */
  .info { width: calc(var(--cell) * 7 + 12px); min-height: 40px; font-size: 13px; text-align: center; color: var(--muted); line-height: 1.35; }
  .info b { color: var(--ink); }
  .shop { width: calc(var(--cell) * 7 + 12px); display: flex; gap: 6px; }
  .shop button, .sell { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 2px;
    display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 700; }
  .shop button span, .sell span { font-family: var(--emoji); font-size: 22px; }
  .shop button:disabled { opacity: .45; }
  .sell { border-style: dashed; color: var(--muted); }
  .sell.hot { background: #ffe0d6; border-color: var(--accent); color: var(--accent); }

  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -80px); background: var(--ink); color: #fff;
    padding: 8px 14px; border-radius: 12px; font-size: 14px; transition: transform .25s; z-index: 60; max-width: 90vw; text-align: center; }
  .toast.show { transform: translate(-50%, 0); }
  .float { position: fixed; pointer-events: none; z-index: 55; font-weight: 800; color: #fff; text-shadow: 0 1px 2px #000a;
    transform: translate(-50%, -50%); animation: rise 1s forwards; font-size: 15px; }
  @keyframes rise { to { transform: translate(-50%, -150%); opacity: 0; } }

  .overlay { position: fixed; inset: 0; background: #0006; display: none; align-items: center; justify-content: center; z-index: 70; }
  .overlay.show { display: flex; }
  .panel { background: var(--card); border-radius: 20px; padding: 22px; width: min(330px, 88vw); text-align: center; }
  .panel h2 { margin: 6px 0; }
  .panel .big { font-family: var(--emoji); font-size: 56px; }
  .panel button { margin-top: 12px; border: 0; background: var(--accent); color: #fff; font-weight: 800; border-radius: 12px; padding: 10px 18px; }
  .foot { font-size: 11px; color: var(--muted); }
  .foot button { background: none; border: 0; text-decoration: underline; color: var(--muted); font-size: 11px; }

  @media (prefers-reduced-motion: reduce) {
    .item.ready { animation: none; outline: 2px dashed #fff8; outline-offset: 2px; border-radius: 6px; }
    .pop { animation: fade .2s; }
    @keyframes fade { from { opacity: .3; } }
    .float { animation: fadeout 1s forwards; }
    @keyframes fadeout { to { opacity: 0; } }
    .quest button, .pill.bump { animation: none; }
    .toast { transition: none; }
  }
</style>
</head>
<body>
  <div class="hud">
    <div class="title">🐾 Kitty Merge</div>
    <div class="pill" id="coinPill">🪙 <span id="coins">0</span></div>
    <div class="pill" id="energyPill">⚡ <span id="energy">0</span><span class="sub" id="energyTimer"></span></div>
  </div>

  <div class="quest" id="quest"></div>
  <div class="board" id="board"></div>
  <div class="info" id="info"></div>
  <div class="shop" id="shop"></div>
  <div class="foot"><span class="version">v0.1</span> · <button id="resetBtn">reset progress</button></div>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"><div class="panel">
    <div class="big">😻🌸🏡</div>
    <h2>Garden restored!</h2>
    <p>Every weed is gone and the cats are purring. Start a fresh garden and keep your coins?</p>
    <button id="newGardenBtn">New garden</button>
  </div></div>

<script>
// ---------- Balance ----------
const CONFIG = {
  cols: 7, rows: 9,
  startCoins: 30,
  energyMax: 20, energyRegenSec: 15,
  fogCost: n => 10 + n * 3,          // price of the n-th fog tile cleared
  fogItemChance: 0.4,                 // chance a cleared fog tile hides a stuck item
  healReward: 1,                      // coins per weedy tile healed
  catUpgradeChance: 0.12,             // per cat tier: chance its gift is level 2
  shop: [ { c: 'nip', t: 0, price: 5 }, { c: 'yarn', t: 0, price: 5 }, { c: 'fish', t: 0, price: 8 }, { c: 'cat', t: 0, price: 20 } ],
};

// Each chain: [emoji, name, extras]. Merge 3 of a level -> 1 of the next (5 -> 2).
//   gen: tap costs 1 energy, drops one of the listed items
//   cat: tap gives a random gift, then naps for N seconds
//   treasure/cd: tap for coins, then cools down cd seconds
//   coin: tap to collect
const CHAINS = {
  nip:  [ ['🌱', 'Catnip Sprout'], ['🌿', 'Catnip'], ['🪴', 'Potted Catnip'],
          ['🌳', 'Catnip Tree', { gen: [['nip', 0]] }],
          ['🌸', 'Blossom Tree', { gen: [['nip', 0], ['nip', 1], ['yarn', 0]] }] ],
  yarn: [ ['🧵', 'Thread'], ['🧶', 'Yarn Ball'], ['🎀', 'Ribbon'], ['🧸', 'Teddy Bear'],
          ['🏰', 'Cat Castle', { treasure: 15, cd: 60 }] ],
  fish: [ ['🐟', 'Minnow'], ['🐠', 'Goldfish'], ['🍣', 'Sushi'], ['🍱', 'Bento Box', { treasure: 6, cd: 40 }] ],
  cat:  [ ['📦', 'Mystery Box'], ['🐱', 'Kitten', { cat: 20 }], ['😺', 'House Cat', { cat: 15 }],
          ['😸', 'Happy Cat', { cat: 11 }], ['😻', 'Lovely Cat', { cat: 8 }], ['🦁', 'Lion King', { cat: 5 }] ],
  coin: [ ['🪙', 'Coin', { coin: 1 }], ['💰', 'Coin Bag', { coin: 5 }], ['💎', 'Gem', { coin: 25 }] ],
};
const CAT_GIFTS = [['nip', 0], ['yarn', 0], ['fish', 0], ['coin', 0]];

const QUESTS = [
  { text: 'Tap the 🌳 Catnip Tree 3 times', goal: 3, prog: s => s.genTaps, reward: { coins: 10 } },
  { text: 'Drag 3 🌱 together to grow 🌿 Catnip', goal: 1, prog: s => s.made.nip1 || 0, reward: { coins: 10 } },
  { text: 'Merge on weeds to heal 5 tiles', goal: 5, prog: s => s.healed, reward: { energy: 5 } },
  { text: 'Merge 3 📦 to adopt a 🐱 Kitten', goal: 1, prog: s => s.made.cat1 || 0, reward: { coins: 15 } },
  { text: 'Tap your kitten for gifts', goal: 3, prog: s => s.catTaps, reward: { energy: 10 } },
  { text: 'Make a 🧶 Yarn Ball', goal: 1, prog: s => s.made.yarn1 || 0, reward: { coins: 15 } },
  { text: 'Clear a ☁️ fog tile', goal: 1, prog: s => s.fog, reward: { coins: 20 } },
  { text: 'Make a 🪴 Potted Catnip', goal: 1, prog: s => s.made.nip2 || 0, reward: { energy: 10 } },
  { text: 'Heal 25 tiles', goal: 25, prog: s => s.healed, reward: { coins: 30 } },
  { text: 'Make a 😺 House Cat', goal: 1, prog: s => s.made.cat2 || 0, reward: { coins: 40 } },
  { text: 'Make 🍣 Sushi', goal: 1, prog: s => s.made.fish2 || 0, reward: { coins: 30 } },
];

// ---------- State ----------
const SAVE_KEY = 'kittymerge';
const N = CONFIG.cols * CONFIG.rows;
const def = it => { const [e, n, x = {}] = CHAINS[it.c][it.t]; return { e, n, ...x, max: it.t === CHAINS[it.c].length - 1 }; };
const same = (a, b) => a && b && a.c === b.c && a.t === b.t;
const now = () => Date.now();

function newGarden() {
  const cells = [];
  for (let r = 0; r < CONFIG.rows; r++) for (let c = 0; c < CONFIG.cols; c++)
    cells.push({ land: r < 3 ? 'fog' : (r >= 6 && c >= 1 && c <= 5) ? 'grass' : 'weed', item: null });
  const put = (r, c, ch, t, stuck) => { cells[r * CONFIG.cols + c].item = stuck ? { c: ch, t, stuck: true } : { c: ch, t }; };
  put(7, 3, 'nip', 3);
  put(8, 1, 'nip', 0); put(8, 5, 'nip', 0); put(5, 0, 'nip', 0, true); put(4, 4, 'nip', 0, true); put(3, 0, 'nip', 1, true);
  put(6, 2, 'cat', 0); put(6, 4, 'cat', 0); put(5, 3, 'cat', 0, true);
  put(7, 1, 'yarn', 0); put(7, 5, 'yarn', 0); put(5, 1, 'yarn', 0, true); put(3, 6, 'yarn', 1, true);
  put(8, 3, 'fish', 0); put(5, 5, 'fish', 0, true); put(4, 2, 'fish', 0, true);
  put(4, 6, 'coin', 0, true);
  return cells;
}
const freshState = () => ({
  v: 1, coins: CONFIG.startCoins, energy: CONFIG.energyMax, energyAt: now(), quest: 0,
  stats: { made: {}, healed: 0, catTaps: 0, genTaps: 0, coinsEarned: 0, fog: 0 },
  cells: newGarden(),
});

const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; } },
  set(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch {} },
};
let S = store.get();
if (!S || !Array.isArray(S.cells) || S.cells.length !== N) S = freshState();
S = { ...freshState(), ...S, cells: S.cells };
S.stats = { ...freshState().stats, ...S.stats };
const save = () => store.set(S);

// ---------- Helpers ----------
const $ = id => document.getElementById(id);
const boardEl = $('board');
const rc = i => [Math.floor(i / CONFIG.cols), i % CONFIG.cols];
function neighbors(i) {
  const [r, c] = rc(i), out = [];
  if (r > 0) out.push(i - CONFIG.cols);
  if (r < CONFIG.rows - 1) out.push(i + CONFIG.cols);
  if (c > 0) out.push(i - 1);
  if (c < CONFIG.cols - 1) out.push(i + 1);
  return out;
}
// Connected cells (4-way) holding the same item as `kind`, starting at `start`, in BFS order.
function group(start, kind, exclude = -1) {
  const seen = new Set([start]), order = [start];
  for (let k = 0; k < order.length; k++)
    for (const n of neighbors(order[k]))
      if (!seen.has(n) && n !== exclude && same(S.cells[n].item, kind)) { seen.add(n); order.push(n); }
  return order;
}
function nearestEmpty(from) {
  const seen = new Set([from]), q = [from];
  for (let k = 0; k < q.length; k++) {
    const i = q[k];
    if (i !== from && S.cells[i].land !== 'fog' && !S.cells[i].item) return i;
    for (const n of neighbors(i)) if (!seen.has(n)) { seen.add(n); q.push(n); }
  }
  return -1;
}
const fogOpen = i => S.cells[i].land === 'fog' && neighbors(i).some(n => S.cells[n].land !== 'fog');

let fresh = new Set(), selected = -1, dragging = null;
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function floatText(i, text) {
  const el = boardEl.children[i]; if (!el) return;
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'float'; f.textContent = text;
  f.style.left = r.left + r.width / 2 + 'px'; f.style.top = r.top + r.height / 2 + 'px';
  document.body.appendChild(f); setTimeout(() => f.remove(), 1000);
}
function bump(id) { const p = $(id); p.classList.remove('bump'); void p.offsetWidth; p.classList.add('bump'); }
function addCoins(n, i) { S.coins += n; S.stats.coinsEarned += n; if (i >= 0) floatText(i, `+${n} 🪙`); bump('coinPill'); }
function spawn(item, near) {
  const i = nearestEmpty(near);
  if (i < 0) { toast('Board is full! Merge or sell something.'); return -1; }
  S.cells[i].item = item; fresh.add(i); return i;
}
const newItem = (c, t) => (CHAINS[c][t][2] || {}).cat ? { c, t, readyAt: 0 } : { c, t };

// ---------- Core rules ----------
// `n` items of `kind` are merging; `order` are the board cells they occupied (closest to the drop first).
function merge(order, n, kind) {
  let outs = Math.floor(n / 5) * 2, rem = n % 5;
  if (rem >= 3) { outs++; rem -= 3; }
  let healed = 0;
  for (const i of order) {
    S.cells[i].item = null;
    if (S.cells[i].land === 'weed') { S.cells[i].land = 'grass'; healed++; }
  }
  for (let k = 0; k < outs; k++) { S.cells[order[k]].item = newItem(kind.c, kind.t + 1); fresh.add(order[k]); }
  for (let k = 0; k < rem; k++) S.cells[order[outs + k]].item = newItem(kind.c, kind.t);
  const key = kind.c + (kind.t + 1);
  S.stats.made[key] = (S.stats.made[key] || 0) + outs;
  if (healed) { S.stats.healed += healed; addCoins(healed * CONFIG.healReward, order[0]); }
  const d = def({ c: kind.c, t: kind.t + 1 });
  setInfo(`✨ Made ${outs > 1 ? outs + '× ' : ''}<b>${d.e} ${d.n}</b>${healed ? ` · healed ${healed} tile${healed > 1 ? 's' : ''}` : ''}`);
}
function tryMerge(i) {
  const it = S.cells[i].item;
  if (!it || def(it).max) return false;
  const g = group(i, it);
  if (g.length < 3) return false;
  merge(g, g.length, { c: it.c, t: it.t });
  return true;
}
// What happens if the item at `from` is dropped on `to`: returns the cells that would merge, or null.
function mergePreview(from, to) {
  const src = S.cells[from].item, dst = S.cells[to];
  if (!src || dst.land === 'fog' || to === from || def(src).max) return null;
  if (dst.item && !same(dst.item, src)) return null;
  const g = group(to, src, from);
  if (!dst.item) g.shift();
  return g.length + 1 >= 3 ? [to, ...g.filter(x => x !== to)] : null;
}
function drop(from, to) {
  const src = S.cells[from].item, dst = S.cells[to];
  if (to === from || dst.land === 'fog') return;
  if (dst.item && same(dst.item, src)) {
    const g = group(to, src, from);
    if (g.length + 1 >= 3 && !def(src).max) { S.cells[from].item = null; merge(g, g.length + 1, src); }
    else toast(def(src).max ? 'That one is already max level!' : 'Need 3 matching items to merge');
    return;
  }
  if (dst.item) {
    if (dst.item.stuck) { toast('That item is stuck in the weeds — merge onto it!'); return; }
    S.cells[from].item = dst.item;
  } else S.cells[from].item = null;
  dst.item = src;
  selected = to;
  if (!tryMerge(to)) showItemInfo(to);
}
function sell(from) {
  const it = S.cells[from].item, value = 2 ** it.t;
  S.cells[from].item = null;
  S.coins += value; bump('coinPill');
  toast(`Sold ${def(it).e} for ${value} 🪙`);
}

function tap(i) {
  const cell = S.cells[i], it = cell.item;
  selected = i;
  if (cell.land === 'fog') {
    if (!fogOpen(i)) { setInfo('☁️ Clear the fog next to your garden first.'); return; }
    const cost = CONFIG.fogCost(S.stats.fog);
    if (S.coins < cost) { setInfo(`☁️ Clearing this fog costs <b>${cost} 🪙</b>. Keep merging to earn coins!`); return; }
    if (cell.armed) {
      S.coins -= cost; delete cell.armed; cell.land = 'weed'; S.stats.fog++;
      if (Math.random() < CONFIG.fogItemChance) {
        const [c] = CAT_GIFTS[Math.floor(Math.random() * 3)];
        cell.item = { c, t: 0, stuck: true }; fresh.add(i);
      }
      setInfo('☁️ Fog cleared! Merge on the weeds to heal them.');
    } else {
      S.cells.forEach(c => delete c.armed); cell.armed = true;
      setInfo(`☁️ Tap again to clear this fog for <b>${cost} 🪙</b>`);
    }
    return;
  }
  S.cells.forEach(c => delete c.armed);
  if (!it) { setInfo(cell.land === 'weed' ? '🍂 Weedy land. Merge items on it to heal it.' : '🌱 Healthy grass.'); return; }
  const d = def(it);
  if (it.stuck) { showItemInfo(i); return; }
  if (d.coin) { S.cells[i].item = null; addCoins(d.coin, i); setInfo(`Collected ${d.e}`); selected = -1; return; }
  if (d.gen) {
    if (S.energy < 1) { toast('Out of ⚡ energy — it refills over time'); return; }
    const [c, t] = d.gen[Math.floor(Math.random() * d.gen.length)];
    if (spawn(newItem(c, t), i) < 0) return;
    if (S.energy === CONFIG.energyMax) S.energyAt = now();
    S.energy--; S.stats.genTaps++; bump('energyPill');
    showItemInfo(i); return;
  }
  if (d.cat || d.treasure) {
    const left = Math.ceil(((it.readyAt || 0) - now()) / 1000);
    if (left > 0) { toast(`${d.e} is napping… ${left}s`); showItemInfo(i); return; }
    if (d.cat) {
      const [c] = CAT_GIFTS[Math.floor(Math.random() * CAT_GIFTS.length)];
      const t = Math.random() < it.t * CONFIG.catUpgradeChance ? 1 : 0;
      if (spawn(newItem(c, t), i) < 0) return;
      S.stats.catTaps++;
      it.readyAt = now() + d.cat * 1000;
      floatText(i, 'purr ♥');
    } else {
      addCoins(d.treasure, i);
      it.readyAt = now() + d.cd * 1000;
    }
    showItemInfo(i); return;
  }
  showItemInfo(i);
}

// ---------- Rendering ----------
function setInfo(html) { $('info').innerHTML = html; }
function showItemInfo(i) {
  const it = S.cells[i].item; if (!it) return;
  const d = def(it);
  let hint;
  if (it.stuck) hint = 'Stuck in the weeds. Drag 2 more of these next to it to merge and free it.';
  else if (d.gen) hint = 'Tap to grow items (⚡1 each).';
  else if (d.cat) hint = `Tap for a gift, then it naps ${d.cat}s.`;
  else if (d.treasure) hint = `Tap for ${d.treasure} 🪙 every ${d.cd}s.`;
  else if (d.coin) hint = 'Tap to collect.';
  if (!d.max) {
    const nx = def({ c: it.c, t: it.t + 1 });
    hint = (hint ? hint + ' ' : '') + `Merge 3 → <b>${nx.e} ${nx.n}</b>.`;
  } else hint = (hint ? hint + ' ' : '') + 'Max level!';
  setInfo(`<b>${d.e} ${d.n}</b> (Lv ${it.t + 1}) — ${hint}`);
}

function render() {
  if (dragging) return;
  const frag = document.createDocumentFragment();
  S.cells.forEach((cell, i) => {
    const el = document.createElement('div');
    const [r, c] = rc(i);
    el.className = `cell ${cell.land}${(r + c) % 2 ? ' alt' : ''}${i === selected ? ' selected' : ''}`;
    el.dataset.i = i;
    if (cell.land === 'fog') {
      const open = fogOpen(i);
      el.classList.toggle('locked', !open);
      el.innerHTML = '☁️' + (open ? `<span class="price">🪙${CONFIG.fogCost(S.stats.fog)}</span>` : '');
    } else if (cell.item) {
      const it = cell.item, d = def(it), iel = document.createElement('div');
      iel.className = 'item' + (it.stuck ? ' stuck' : '') + (fresh.has(i) ? ' pop' : '');
      iel.textContent = d.e;
      iel.innerHTML += `<span class="lv">${it.t + 1}</span>` + (d.gen ? '<span class="badge">⚡</span>' : '');
      el.appendChild(iel);
    }
    frag.appendChild(el);
  });
  boardEl.replaceChildren(frag);
  fresh.clear();
  renderHud(); renderQuest(); renderShop(); updateTimers();
  if (!S.cells.some(c => c.land !== 'grass')) $('overlay').classList.add('show');
  save();
}
function renderHud() {
  $('coins').textContent = S.coins;
  $('energy').textContent = S.energy;
  const left = CONFIG.energyRegenSec - Math.floor((now() - S.energyAt) / 1000);
  $('energyTimer').textContent = S.energy < CONFIG.energyMax ? ` ${Math.max(left, 0)}s` : '';
}
function renderQuest() {
  const q = QUESTS[S.quest], el = $('quest');
  if (!q) { el.innerHTML = '<div class="q-text">🎉 All goals done! Heal every tile to restore the garden.</div>'; return; }
  const p = Math.min(q.prog(S.stats), q.goal);
  const rw = q.reward.coins ? `+${q.reward.coins} 🪙` : `+${q.reward.energy} ⚡`;
  el.innerHTML = `<div class="q-text">${q.text} <span class="reward">${p}/${q.goal} · ${rw}</span>
    <div class="q-bar"><i style="width:${p / q.goal * 100}%"></i></div></div>` + (p >= q.goal ? '<button id="claimBtn">Claim</button>' : '');
  const btn = $('claimBtn');
  if (btn) btn.onclick = () => {
    if (q.reward.coins) { S.coins += q.reward.coins; bump('coinPill'); }
    if (q.reward.energy) { S.energy += q.reward.energy; bump('energyPill'); }
    toast(`Goal complete! ${rw}`);
    S.quest++; render();
  };
}
function renderShop() {
  const shop = $('shop');
  if (!shop.children.length) {
    shop.innerHTML = CONFIG.shop.map((s, k) => `<button data-k="${k}"><span>${def(s).e}</span>${s.price} 🪙</button>`).join('')
      + '<div class="sell" id="sell"><span>🧺</span>Sell</div>';
    shop.querySelectorAll('button').forEach(b => b.onclick = () => {
      const s = CONFIG.shop[b.dataset.k];
      if (S.coins < s.price) return toast('Not enough 🪙');
      const center = 7 * CONFIG.cols + 3;
      const i = S.cells[center].item ? spawn(newItem(s.c, s.t), center) : (S.cells[center].item = newItem(s.c, s.t), fresh.add(center), center);
      if (i < 0) return;
      S.coins -= s.price; selected = i; showItemInfo(i); render();
    });
  }
  shop.querySelectorAll('button').forEach(b => b.disabled = S.coins < CONFIG.shop[b.dataset.k].price);
}
function updateTimers() {
  const t = now();
  for (const el of boardEl.children) {
    const it = S.cells[el.dataset.i].item; if (!it || it.stuck) continue;
    const d = def(it); if (!(d.cat || d.treasure)) continue;
    const napping = (it.readyAt || 0) > t;
    el.classList.toggle('napping', napping);
    el.firstChild.classList.toggle('ready', !napping);
  }
}

// Energy regen + nap timers.
setInterval(() => {
  let changed = false;
  while (S.energy < CONFIG.energyMax && now() - S.energyAt >= CONFIG.energyRegenSec * 1000) {
    S.energy++; S.energyAt += CONFIG.energyRegenSec * 1000; changed = true;
  }
  if (S.energy >= CONFIG.energyMax && changed) S.energyAt = now();
  renderHud(); updateTimers();
  if (changed) save();
}, 1000);

// ---------- Input: tap or drag ----------
const cellAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.cell'); };
let press = null;
boardEl.addEventListener('pointerdown', e => {
  const cellEl = e.target.closest('.cell'); if (!cellEl) return;
  press = { i: +cellEl.dataset.i, x: e.clientX, y: e.clientY, id: e.pointerId };
  boardEl.setPointerCapture(e.pointerId);
});
boardEl.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  const it = S.cells[press.i].item;
  if (!dragging) {
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < 8 || !it || it.stuck) return;
    const ghost = document.createElement('div');
    ghost.className = 'ghost'; ghost.textContent = def(it).e;
    document.body.appendChild(ghost);
    boardEl.children[press.i].firstChild.classList.add('lifted');
    dragging = { from: press.i, ghost, over: -1 };
  }
  dragging.ghost.style.left = e.clientX + 'px'; dragging.ghost.style.top = e.clientY + 'px';
  const over = cellAt(e.clientX, e.clientY), oi = over ? +over.dataset.i : -1;
  $('sell').classList.toggle('hot', !!document.elementFromPoint(e.clientX, e.clientY)?.closest('#sell'));
  if (oi !== dragging.over) {
    dragging.over = oi;
    for (const el of boardEl.children) el.classList.remove('preview', 'target');
    if (oi >= 0) {
      const g = mergePreview(dragging.from, oi);
      if (g) g.forEach(k => boardEl.children[k].classList.add('preview'));
      else boardEl.children[oi].classList.add('target');
    }
  }
});
function endPress(e) {
  if (!press || e.pointerId !== press.id) return;
  const p = press; press = null;
  if (!dragging) { if (e.type === 'pointerup') tap(p.i); render(); return; }
  const d = dragging; dragging = null; d.ghost.remove();
  $('sell').classList.remove('hot');
  if (e.type === 'pointerup') {
    const over = cellAt(e.clientX, e.clientY);
    if (document.elementFromPoint(e.clientX, e.clientY)?.closest('#sell')) sell(d.from);
    else if (over) drop(d.from, +over.dataset.i);
  }
  render();
}
boardEl.addEventListener('pointerup', endPress);
boardEl.addEventListener('pointercancel', endPress);

$('resetBtn').onclick = () => { if (confirm('Reset all progress?')) { S = freshState(); selected = -1; render(); setInfo(INTRO); } };
$('newGardenBtn').onclick = () => {
  S.cells = newGarden(); S.energy = Math.max(S.energy, CONFIG.energyMax); selected = -1;
  $('overlay').classList.remove('show'); render(); setInfo(INTRO);
};

const INTRO = 'Drag <b>3 matching items</b> together to merge them. Merging on <b>🍂 weeds</b> heals the land. Tap 🌳 to grow sprouts!';
render();
setInfo(INTRO);
</script>
</body>
</html>
