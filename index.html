<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4fb8cf">
<title>Kitty Merge</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="game"></div>

  <div class="top">
    <div class="res"><div class="pill"><span class="ic">🪙</span><span id="coins">0</span></div>
      <div class="pill"><span class="ic">💎</span><span id="gems">0</span></div>
      <div class="pill"><span class="ic">⭐</span><span id="stars">0</span></div>
      <div class="pill"><span class="ic">🐱</span><span id="cats">0</span></div></div>
    <button id="menuBtn" class="round" aria-label="Menu">☰</button>
  </div>

  <div id="quest" class="quest">
    <div class="q-head">GOAL <span id="questReward" class="q-reward"></span></div>
    <div id="questText"></div>
    <div class="q-track"><i id="questBar"></i></div>
    <button id="claimBtn" hidden>Claim</button>
  </div>

  <div id="info" class="info"></div>
  <button id="shopBtn" class="shop-btn" aria-label="Shop">🛒<span>Shop</span></button>
  <div id="version" class="version"></div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal"><div class="panel"><div id="modalBody"></div><div id="modalButtons" class="buttons"></div></div></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
